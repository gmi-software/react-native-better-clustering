version: 2

updates:
  # The workflows pin every action by commit SHA, which never resolves to a newer
  # release on its own. Without this, those pins silently rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns:
          - '*'
    # Keep the subject conventional — the commitlint job runs on every pull
    # request, Dependabot's included.
    commit-message:
      prefix: chore

  # Bun is its own Dependabot ecosystem, not part of `npm`: it reads `bun.lock`.
  # Version updates are supported; security updates are not, so Dependabot
  # security alerts for these dependencies have to be acted on by hand.
  - package-ecosystem: bun
    # Only the root. `bun.lock` lives here, and a run from `/` already updates
    # package/ and example/ through the workspaces. Listing those two as well
    # opened a second copy of every bump without the lockfile, which fails
    # `bun install --frozen-lockfile` in every job.
    directory: /
    schedule:
      interval: monthly
    # A dependency that matches several groups goes to the one whose pattern
    # names it most exactly, so the catch-all groups keep `patterns: ['*']`.
    # GitHub's options reference does not list `dependency-type` for bun, but
    # Dependabot applies it with the npm rule: `dependencies` and
    # `optionalDependencies` are production, everything else development.
    groups:
      # The docs site. Its @docusaurus/* packages are pinned together through
      # the root `overrides`, so they move as one reviewed bump. Dependabot
      # cannot edit `overrides`: move them by hand in its pull request.
      docusaurus:
        patterns:
          - '@docusaurus/*'
          - '@easyops-cn/docusaurus-search-local'
      # Runtime dependencies. Only the example app has any; the library itself
      # declares peers only.
      example-app:
        dependency-type: production
        patterns:
          - '*'
      # Minor and patch updates should pass as they are. Majors usually need a
      # config or code change, so they get a pull request of their own instead
      # of failing all the others with them.
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      dev-dependencies-major:
        dependency-type: development
        update-types:
          - major
        patterns:
          - '*'
    ignore:
      # React Native, React and Nitro are peer dependencies with native
      # counterparts; upgrading them is a deliberate, tested change, never an
      # automated bump.
      - dependency-name: react
      - dependency-name: react-native
      - dependency-name: react-native-nitro-modules
      - dependency-name: nitrogen
      - dependency-name: react-native-maps
      # React refuses to render next to a react-dom of any other version.
      - dependency-name: react-dom
      # The root `overrides` pin Reanimated and Worklets, which Dependabot
      # cannot edit, so its bumps never install. Each Reanimated minor also
      # supports only a few React Native minors (4.7 needs 0.86) and a single
      # Worklets minor: the pair moves with React Native.
      - dependency-name: react-native-reanimated
      - dependency-name: react-native-worklets
      # These share React Native's version and move with it.
      - dependency-name: '@react-native/*'
      # Expo SDK 56 expects ~5.7; `npx expo install --fix` moves it.
      - dependency-name: react-native-safe-area-context
        update-types:
          - 'version-update:semver-minor'
          - 'version-update:semver-major'
      # The JS fake engine stands in for react-native-map-clustering, which
      # depends on supercluster ^8. Version 9 changes coordinate precision.
      - dependency-name: supercluster
        update-types: ['version-update:semver-major']
      # A new major of an Expo package belongs to the next Expo SDK. Moving to
      # it is an SDK upgrade (`npx expo install --fix`), not a single bump.
      - dependency-name: expo
        update-types: ['version-update:semver-major']
      - dependency-name: 'expo-*'
        update-types: ['version-update:semver-major']
      - dependency-name: '@expo/*'
        update-types: ['version-update:semver-major']
      - dependency-name: babel-preset-expo
        update-types: ['version-update:semver-major']
      # babel-preset-expo is built from Babel 7 plugins.
      - dependency-name: '@babel/core'
        update-types: ['version-update:semver-major']
      # typescript-eslint refuses to run on TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7.0.0']
    commit-message:
      prefix: chore

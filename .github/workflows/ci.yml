name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A superseded push to a pull request has nothing to add. Runs on main are
  # never cancelled and each commit gets its own group — a shared group would
  # still let a newer pending run replace an older one — so every merge keeps
  # its own verdict.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Job ids double as the status-check names the `main` ruleset requires
# (commitlint, quality, cpp), so they carry no `name:` that could drift.
jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        working-directory: package
        run: bun run lint-ci

      - name: Typecheck
        working-directory: package
        run: bun run typecheck

      - name: Test
        working-directory: package
        run: bun run test:ci

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compile and run the ClusterEngineCore tests
        working-directory: package/cpp
        run: |
          c++ -std=c++20 -I. ClusterEngineCore.test.cpp -o cluster_test
          ./cluster_test

  # The two example-app builds below are replaced by the path-filtered
  # native.yml / native-build.yml pair in a follow-up; until then they only get
  # the same hardening as the jobs above.
  android:
    name: Android example build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild Android project
        working-directory: example
        run: bunx expo prebuild -p android --clean

      - name: Assemble debug APK
        working-directory: example/android
        run: ./gradlew assembleDebug --no-daemon

  ios:
    name: iOS example build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prebuild iOS project
        working-directory: example
        run: bunx expo prebuild -p ios --clean

      - name: Install CocoaPods
        working-directory: example/ios
        run: pod install

      - name: Build for simulator
        working-directory: example/ios
        run: |
          xcodebuild build \
            -workspace NitroMapClusterExample.xcworkspace \
            -scheme NitroMapClusterExample \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

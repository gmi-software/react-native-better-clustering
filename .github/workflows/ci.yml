name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A superseded push to a pull request has nothing to add. Runs on main are
  # never cancelled and each commit gets its own group — a shared group would
  # still let a newer pending run replace an older one — so every merge keeps
  # its own verdict.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Job ids double as the status-check names the `main` ruleset requires
# (commitlint, quality, cpp), so they carry no `name:` that could drift.
jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bunx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # bun install already ran it through the package's `prepare` script; this
      # makes a broken spec fail as its own step.
      - name: Codegen
        working-directory: package
        run: bun run specs

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        working-directory: package
        run: bun run typecheck

      - name: Build
        working-directory: package
        run: bun run build

      - name: Test
        working-directory: package
        run: bun run test:ci

      # Fails on binaries, benchmarks, tests or files defining main() in the
      # tarball, and on missing build output, generated bindings or README.
      - name: Verify package contents
        working-directory: package
        run: bun run verify:pack

      # Every exports subpath must resolve from the packed tarball under both
      # the require and import conditions.
      - name: Verify package exports
        working-directory: package
        run: bun run verify:exports

  cpp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # g++'s `undefined` group leaves out float-cast-overflow, which catches a
      # NaN or out-of-range double cast to int; name it, and stop on the first
      # report so undefined behaviour fails the job.
      - name: Compile and run the ClusterEngineCore tests
        working-directory: package/cpp
        run: |
          c++ -std=c++20 -I. -fsanitize=undefined,float-cast-overflow -fno-sanitize-recover=all ClusterEngineCore.test.cpp -o cluster_test
          ./cluster_test

      # halt_on_error fails the job on the first data race. The sysctl is
      # needed because Ubuntu runners randomize mmap with more bits than g++'s
      # TSan runtime supports, which aborts it at startup.
      - name: Compile and run the ThreadSafeClusterEngine tests under TSan
        working-directory: package/cpp
        env:
          TSAN_OPTIONS: halt_on_error=1
        run: |
          sudo sysctl vm.mmap_rnd_bits=28
          c++ -std=c++20 -I. -g -O1 -fsanitize=thread -pthread ThreadSafeClusterEngine.test.cpp -o thread_test
          ./thread_test

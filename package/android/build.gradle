buildscript {
  repositories {
    google()
    mavenCentral()
  }

  dependencies {
    classpath "com.android.tools.build:gradle:9.2.1"
  }
}

def reactNativeArchitectures() {
  def value = rootProject.getProperties().get("reactNativeArchitectures")
  return value ? value.split(",") : ["armeabi-v7a", "x86", "x86_64", "arm64-v8a"]
}

def isNewArchitectureEnabled() {
  return rootProject.hasProperty("newArchEnabled") && rootProject.getProperty("newArchEnabled") == "true"
}

apply plugin: "com.android.library"

// AGP 9 compiles Kotlin itself unless an app opts out with
// android.builtInKotlin=false (as the React Native 0.87 and 0.88 templates
// still do), and fails when the Kotlin plugin is applied on top of it. Older
// AGP versions need the plugin.
def builtInKotlin() {
  def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize('.')[0].toInteger()
  return agpMajor >= 9 && project.findProperty("android.builtInKotlin")?.toString() != "false"
}

if (!builtInKotlin()) {
  apply plugin: 'org.jetbrains.kotlin.android'
}
apply from: '../nitrogen/generated/android/NitroMapCluster+autolinking.gradle'
apply from: "./fix-prefab.gradle"

def getExtOrDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : project.properties["NitroMapCluster_" + name]
}

def getExtOrIntegerDefault(name) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : (project.properties["NitroMapCluster_" + name]).toInteger()
}

android {
  namespace "com.margelo.nitro.nitromapcluster"

  ndkVersion getExtOrDefault("ndkVersion")
  compileSdk getExtOrIntegerDefault("compileSdkVersion")

  defaultConfig {
    minSdk getExtOrIntegerDefault("minSdkVersion")
    buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()

    externalNativeBuild {
      cmake {
        cppFlags "-frtti -fexceptions -Wall -Wextra -fstack-protector-all"
        arguments "-DANDROID_STL=c++_shared", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON"
        abiFilters (*reactNativeArchitectures())
      }
    }
  }

  externalNativeBuild {
    cmake {
      path "CMakeLists.txt"
    }
  }

  packaging {
    resources.excludes += [
      "META-INF",
      "META-INF/**"
    ]
    jniLibs.excludes += [
      "**/libc++_shared.so",
      "**/libNitroModules.so",
      "**/libfbjni.so",
      "**/libjsi.so",
      "**/libfolly_json.so",
      "**/libfolly_runtime.so",
      "**/libglog.so",
      "**/libhermes.so",
      "**/libhermes-executor-debug.so",
      "**/libhermes_executor.so",
      "**/libreactnative.so",
      "**/libreactnativejni.so",
      "**/libturbomodulejsijni.so",
      "**/libreact_nativemodule_core.so",
      "**/libjscexecutor.so"
    ]
  }

  buildFeatures {
    buildConfig true
    prefab true
  }

  // Per build type here, not inside defaultConfig's cmake block: a buildTypes
  // block there resolves to this one through Groovy's delegation and gave every
  // variant both sets of flags.
  buildTypes {
    debug {
      externalNativeBuild {
        cmake {
          cppFlags "-O1 -g"
        }
      }
    }
    release {
      minifyEnabled false
      externalNativeBuild {
        cmake {
          cppFlags "-O2"
        }
      }
    }
  }

  lint {
    disable "GradleCompatible"
  }

}

repositories {
  mavenCentral()
  google()
}


dependencies {
  // For < 0.71, this will be from the local maven repo
  // For > 0.71, this will be replaced by `com.facebook.react:react-android:$version` by react gradle plugin
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"

  // Add a dependency on NitroModules
  implementation project(":react-native-nitro-modules")
}

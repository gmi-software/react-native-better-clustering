appId: com.nitromapcluster.example
name: Antimeridian
---
- runFlow:
    file: subflows/open-scenario.yaml
    env:
      SCENARIO: antimeridian
- extendedWaitUntil:
    visible:
      id: hud-engine-builds
      text: 'Engine builds: 1'
    timeout: 30000
# Markers on both sides of ±180° are all found (#18).
- assertVisible:
    id: visible-points
    text: 'Visible points: 40 of 40'
- tapOn:
    id: recentre
- runFlow: subflows/settle.yaml
- assertVisible:
    id: visible-points
    text: 'Visible points: 40 of 40'
